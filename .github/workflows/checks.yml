name: Foundation checks
on:
  push:
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: career_club_connect
          POSTGRES_USER: ccc_local
          POSTGRES_PASSWORD: local_dev_only_change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccc_local -d career_club_connect"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: '0'
      POSTGRES_DB: career_club_connect
      POSTGRES_USER: ccc_local
      POSTGRES_PASSWORD: local_dev_only_change_me
      POSTGRES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py migrate --noinput
      - run: python manage.py test
